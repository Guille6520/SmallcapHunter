name: tests

# La suite de tests/ es deliberadamente offline (sin BD, sin API keys,
# sin red — ver tests/conftest.py y el docstring de cada archivo): eso
# es lo que la hace apta para CI. validacion_recall_ganadoras.py y los
# demás scripts de validación histórica (30-60 min, red + Postgres) NO
# corren aquí a propósito, esos se ejecutan a mano.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 3.12: la misma versión que usa el Dockerfile, para las que requirements.txt
      # fija versiones con ruedas publicadas.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # dashboard.py ejecuta Streamlit al importarlo y casi ningún test lo toca: al menos
      # que compile, para que un error de sintaxis no llegue a main sin que nadie lo vea.
      - name: Comprobar que todo el código compila
        run: python -m compileall -q .

      - name: Ejecutar tests
        run: python -m pytest tests -q
